name: Discord Bot Quality Checks

on:
  push:
    branches: [main, "rewrite/complete-v2"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax, preset, integration and quality tests
        run: npm run check
