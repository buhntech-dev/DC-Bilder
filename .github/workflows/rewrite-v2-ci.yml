name: Rewrite V2 CI

on:
  push:
    branches:
      - rewrite/complete-v2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Syntax-, Preset-, Mock- und Featuretests
        run: npm test
